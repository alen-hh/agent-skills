<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype</title>
  <style>
    :root {
      --text: #18181b;
      --muted: #71717a;
      --faint: #a1a1aa;
      --line: #e4e4e7;
      --wash: #f4f4f5;
      --surface: #ffffff;
      --success: #15803d;
      --info: #1d4ed8;
      --warning: #a16207;
      --danger: #b91c1c;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      animation: none !important;
      transition: none !important;
    }

    /*
      Short pages sit in the vertical middle. Tall pages start at the top
      and scroll: empty 1fr rows collapse once .page is taller than the viewport.
      Do not replace this with align-items: center.
    */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      background: var(--surface);
      color: var(--text);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .page {
      grid-row: 2;
      width: min(100%, 1440px);
      justify-self: center;
      padding: 32px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
    }

    p { margin: 0; }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    :focus-visible {
      outline: 1px solid var(--text);
      outline-offset: 2px;
    }

    .muted { color: var(--muted); }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .spread { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .icon {
      width: 16px;
      height: 16px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text);
    }

    .icon-btn:hover { background: var(--wash); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 6px;
      background: var(--text);
      color: var(--surface);
    }

    .btn.danger { background: var(--danger); }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field span { color: var(--muted); }

    .field input,
    .field select,
    .field textarea {
      height: 32px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--surface);
    }

    .field textarea { height: auto; padding: 8px; }

    .status-success { color: var(--success); }
    .status-info { color: var(--info); }
    .status-warning { color: var(--warning); }
    .status-danger { color: var(--danger); }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: var(--muted);
      font-weight: 500;
    }

    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }

    thead th { background: var(--wash); }

    .nav { display: flex; flex-direction: column; gap: 4px; }

    .nav a {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
    }

    .nav a[aria-current="page"],
    .nav a:hover { background: var(--wash); }
  </style>
</head>
<body>
  <main class="page">
  </main>
</body>
</html>
